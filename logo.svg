<svg xmlns="http://www.w3.org/2000/svg" viewBox="4 10 92 92" role="img" aria-label="planetario">
  <style>
    .dome { stroke: #b4befe; }
    .line { stroke: #fab387; }
    .star { fill: #fab387; }
    @media (prefers-color-scheme: light) {
      .dome { stroke: #7287fd; }
      .line { stroke: #fe640b; }
      .star { fill: #fe640b; }
    }
  </style>
  <defs>
    <filter id="wobble" filterUnits="userSpaceOnUse" x="0" y="0" width="100" height="100">
      <feTurbulence type="fractalNoise" baseFrequency="0.045" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="2.6"/>
    </filter>
  </defs>
  <g filter="url(#wobble)" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path class="dome" d="M14 72 A36 36 0 0 1 86 72" stroke-width="4"/>
    <path class="dome" d="M24 72 A26 26 0 0 1 76 72" stroke-width="1.2" stroke-dasharray="2 4" opacity=".6"/>
    <path class="line" d="M32 63 L41 52 L53 49 L63 56 L70 48" stroke-width="1.6"/>
    <path class="dome" d="M8 74 L92 74" stroke-width="4"/>
  </g>
  <g class="star">
    <circle cx="32" cy="63" r="2.3"/>
    <circle cx="41" cy="52" r="2.3"/>
    <circle cx="53" cy="49" r="2.6"/>
    <circle cx="63" cy="56" r="2.3"/>
    <circle cx="70" cy="48" r="2.3"/>
  </g>
</svg>

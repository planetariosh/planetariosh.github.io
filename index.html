<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <meta name="color-scheme" content="dark light">
    <title>planetario</title>
    <meta name="description" content="Hi there, I make stellar software and tools for the terminal.">
    <link rel="stylesheet" href="/style.css">
    <link rel="icon" type="image/svg+xml" href="/logo.svg">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  </head>
  <body>
    <svg xmlns="http://www.w3.org/2000/svg" width="0" height="0" aria-hidden="true" style="position: absolute;">
      <defs>
        <filter id="wobble" filterUnits="userSpaceOnUse" x="0" y="0" width="100" height="100">
          <feTurbulence type="fractalNoise" baseFrequency="0.045" numOctaves="2" seed="7"/>
          <feDisplacementMap in="SourceGraphic" scale="2.6"/>
        </filter>
      </defs>
      <symbol id="logo" viewBox="4 20 92 60"> 
        <g filter="url(#wobble)" fill="none" stroke-linecap="round" stroke-linejoin="round">
          <path class="logo-dome" d="M14 72 A36 36 0 0 1 86 72" stroke-width="4"/>
          <path class="logo-dome" d="M24 72 A26 26 0 0 1 76 72" stroke-width="1.2" stroke-dasharray="2 4" opacity=".6"/>
          <path class="logo-line" d="M32 63 L41 52 L53 49 L63 56 L70 48" stroke-width="1.6"/>
          <path class="logo-dome" d="M8 74 L92 74" stroke-width="4"/>
        </g>
        <g class="logo-star">
          <circle cx="32" cy="63" r="2.3"/>
          <circle cx="41" cy="52" r="2.3"/>
          <circle cx="53" cy="49" r="2.6"/>
          <circle cx="63" cy="56" r="2.3"/>
          <circle cx="70" cy="48" r="2.3"/>
        </g>
      </symbol>
    </svg>
    <div class="wrapper">
      <header>
        <svg aria-hidden="true" width="140" height="91">
          <use href="#logo"/>
        </svg>
        <h1>planetario</h1>
        <p>Hi there, I make stellar software and tools for the terminal.</p>
      </header>
      <main>
        <article class="project">
          <h2>project</h2>
          <p>amazing tool for terminal</p>
          <a href="">link to the project</a>
        </article>
      </main>
      <footer>
        <p>contact me at hi@planetario.sh</p>
      </footer>
    </div>
  </body>
</html>

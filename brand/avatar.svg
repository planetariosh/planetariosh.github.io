<svg xmlns="http://www.w3.org/2000/svg" width="500" height="500" viewBox="0 0 100 100">
  <!-- GitHub org avatar: B1 logo on Catppuccin Mocha base, kept inside
       the middle of the square so GitHub's round crop doesn't cut it. -->
  <defs>
    <filter id="wobble" filterUnits="userSpaceOnUse" x="0" y="0" width="100" height="100">
      <feTurbulence type="fractalNoise" baseFrequency="0.045" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="2.6"/>
    </filter>
  </defs>
  <rect width="100" height="100" fill="#1e1e2e"/>
  <g transform="translate(13.6 10) scale(0.727)">
    <g filter="url(#wobble)" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M14 72 A36 36 0 0 1 86 72" stroke="#b4befe" stroke-width="4"/>
      <path d="M24 72 A26 26 0 0 1 76 72" stroke="#b4befe" stroke-width="1.2" stroke-dasharray="2 4" opacity=".6"/>
      <path d="M32 63 L41 52 L53 49 L63 56 L70 48" stroke="#fab387" stroke-width="1.6"/>
      <path d="M8 74 L92 74" stroke="#b4befe" stroke-width="4"/>
    </g>
    <g fill="#fab387">
      <circle cx="32" cy="63" r="2.3"/>
      <circle cx="41" cy="52" r="2.3"/>
      <circle cx="53" cy="49" r="2.6"/>
      <circle cx="63" cy="56" r="2.3"/>
      <circle cx="70" cy="48" r="2.3"/>
    </g>
  </g>
</svg>
